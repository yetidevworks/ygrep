[workspace]
resolver = "2"
members = [
    "crates/ygrep-core",
    "crates/ygrep-cli",
]

[workspace.package]
version = "4.0.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/yetidevworks/ygrep"
authors = ["YetiDevWorks"]

[workspace.dependencies]
# Internal crates
ygrep-core = { path = "crates/ygrep-core", version = "4.0.0" }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Error handling
thiserror = "2"
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Search & Indexing
tantivy = { version = "0.22", features = ["zstd-compression"] }
fastembed = { version = "4", default-features = false, features = ["ort-download-binaries", "hf-hub-rustls-tls"] }
hnsw_rs = "0.3"
lru = "0.12"
bincode = "1"

# File Watching
notify = "7"
notify-debouncer-full = "0.4"
ignore = "0.4"

# CLI
clap = { version = "4", features = ["derive", "env"] }
indicatif = "0.17"

# TUI
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }

# HTTP
ureq = { version = "2", features = ["json"] }

# Utils
memchr = "2"
parking_lot = "0.12"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
fs2 = "0.4"
libc = "0.2"
dirs = "5"
walkdir = "2"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
tempfile = "3"
