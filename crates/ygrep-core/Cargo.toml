[package]
name = "ygrep-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Core library for ygrep – fast, local, indexed code search"
repository = "https://github.com/yetidevworks/ygrep"
homepage = "https://github.com/yetidevworks/ygrep"
readme = "../../README.md"
keywords = ["search", "code-search", "indexing", "grep", "tantivy"]
categories = ["command-line-utilities", "text-processing"]
authors = ["YetiDevWorks"]

[features]
default = []
embeddings = ["dep:fastembed", "dep:hnsw_rs"]

[dependencies]
# Async
tokio = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }

# Error handling
thiserror = { workspace = true }

# Logging
tracing = { workspace = true }

# Search & Indexing
tantivy = { workspace = true }
fastembed = { workspace = true, optional = true }
hnsw_rs = { workspace = true, optional = true }
lru = { workspace = true }
bincode = { workspace = true }

# File Watching
notify = { workspace = true }
notify-debouncer-full = { workspace = true }
ignore = { workspace = true }

# Utils
parking_lot = { workspace = true }
xxhash-rust = { workspace = true }
dirs = { workspace = true }
walkdir = { workspace = true }
chrono = { workspace = true }
indicatif = { workspace = true }
regex = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
