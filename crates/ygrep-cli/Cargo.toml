[package]
name = "ygrep-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Fast, local, indexed code search for AI coding assistants"
repository = "https://github.com/yetidevworks/ygrep"
homepage = "https://github.com/yetidevworks/ygrep"
readme = "../../README.md"
keywords = ["search", "code-search", "grep", "cli", "ai"]
categories = ["command-line-utilities", "development-tools"]
authors = ["YetiDevWorks"]

[features]
default = ["embeddings"]
embeddings = ["ygrep-core/embeddings"]

[[bin]]
name = "ygrep"
path = "src/main.rs"

[dependencies]
ygrep-core = { workspace = true }

# Async
tokio = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Error handling
anyhow = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# CLI
clap = { workspace = true }

# TUI
ratatui = { workspace = true }
crossterm = { workspace = true }

# HTTP
ureq = { workspace = true }

# Utils
dirs = { workspace = true }
chrono = { workspace = true }
walkdir = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
