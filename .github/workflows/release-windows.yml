name: Release Windows binary

on:
  release:
    types: [published]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build:
    name: Build windows-x86_64
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Parse version from tag
        id: v
        shell: bash
        run: |
          RAW_TAG="${GITHUB_REF_NAME}"
          echo "version=${RAW_TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Package
        id: pkg
        shell: bash
        run: |
          set -euo pipefail
          VER='${{ steps.v.outputs.version }}'
          BIN="target/x86_64-pc-windows-msvc/release/ygrep.exe"
          OUT="ygrep-${VER}-windows-x86_64.zip"
          mkdir -p package
          cp "$BIN" package/ygrep.exe
          (cd package && 7z a -tzip "../$OUT" ygrep.exe > /dev/null)
          SHA=$(sha256sum "$OUT" | awk '{print $1}')
          echo "file=$OUT" >> $GITHUB_OUTPUT
          echo "sha=$SHA" >> $GITHUB_OUTPUT

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "${GITHUB_REF_NAME}" "${{ steps.pkg.outputs.file }}" --repo "${GITHUB_REPOSITORY}" --clobber

      - name: Publish archive as artifact
        uses: actions/upload-artifact@v4
        with:
          name: archive-windows-x86_64
          path: ${{ steps.pkg.outputs.file }}
